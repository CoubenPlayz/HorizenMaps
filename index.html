<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>HorizonMaps</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>
<style>
  :root{
    --bg:#ffffff; --panel:#ffffff; --text:#1a1a1a; --muted:#6b6b6b;
    --border:#e3e3e3; --accent:#4285F4; --accent2:#34A853; --danger:#ea4335;
    --shadow: 0 2px 14px rgba(0,0,0,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15181c; --panel:#22262b; --text:#f1f1f1; --muted:#9aa0a6;
      --border:#3a3f45; --shadow: 0 2px 14px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#15181c; --panel:#22262b; --text:#f1f1f1; --muted:#9aa0a6;
    --border:#3a3f45; --shadow: 0 2px 14px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--text);}
  #map{ position:absolute; inset:0; }
  #panel{
    position:absolute; top:calc(12px + env(safe-area-inset-top,0px)); left:12px; z-index:1000;
    background:var(--panel); padding:14px; border-radius:12px; width:260px;
    max-width:calc(100vw - 24px);
    box-shadow:var(--shadow); border:1px solid var(--border);
  }
  #panel label{ font-size:11px; color:var(--muted); display:block; margin:8px 0 3px; }
  #panel label:first-child{ margin-top:0; }
  .row{ display:flex; gap:6px; }
  input{
    width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:14px;
  }
  input:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
  .iconbtn{
    flex:0 0 auto; width:38px; border-radius:8px; border:1px solid var(--border);
    background:var(--bg); cursor:pointer; font-size:16px;
  }
  button.primary{
    width:100%; padding:10px; margin-top:10px; border:none; border-radius:8px;
    background:var(--accent); color:white; font-size:14px; font-weight:600; cursor:pointer;
  }
  button.primary:disabled{ opacity:0.55; cursor:default; }
  button.primary:active{ filter:brightness(0.92); }
  #status{ font-size:12px; color:var(--muted); margin-top:8px; min-height:14px; }
  #status.err{ color:var(--danger); }

  .route-summary{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:2px; font-family:inherit; color:var(--text);
  }
  .route-summary .big{ font-size:16px; font-weight:700; }
  .route-summary .sub{ font-size:12px; color:var(--muted); margin-top:2px; }
  .leaflet-popup-content-wrapper{ border-radius:10px; }

  .field-wrap{ position:relative; }
  .suggestions{
    display:none; position:absolute; top:100%; left:0; right:0; margin-top:4px;
    background:var(--panel); border:1px solid var(--border); border-radius:8px;
    max-height:220px; overflow-y:auto; box-shadow:var(--shadow); z-index:1001;
  }
  .suggestions.show{ display:block; }
  .suggestion-item{
    padding:8px 10px; font-size:12.5px; line-height:1.3; cursor:pointer;
    border-bottom:1px solid var(--border);
  }
  .suggestion-item:last-child{ border-bottom:none; }
  .suggestion-item:hover{ background:var(--bg); }
  .freq-badge{ font-size:10px; color:var(--accent); margin-left:6px; white-space:nowrap; }
</style>
</head>
<body>

<div id="panel">
  <label for="origin">From</label>
  <div class="field-wrap">
    <div class="row">
      <input id="origin" placeholder="Your location or an address" autocomplete="off"/>
      <button class="iconbtn" onclick="useGPS()" title="Use current location">📍</button>
    </div>
    <div class="suggestions" id="originSuggest"></div>
  </div>

  <label for="dest">To</label>
  <div class="field-wrap">
    <input id="dest" placeholder="Enter destination" autocomplete="off"/>
    <div class="suggestions" id="destSuggest"></div>
  </div>

  <button class="primary" id="routeBtn" onclick="go()">Route</button>
  <div id="status">Enter a starting point and destination.</div>
</div>

<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
  var map = L.map('map').setView([37.3382, -121.8863], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  var originMarker = null, destMarker = null, routeLine = null, gpsCoords = null;
  var selectedOrigin = null, selectedDest = null;

  function setStatus(msg, isErr){
    var el = document.getElementById('status');
    el.textContent = msg;
    el.className = isErr ? 'err' : '';
  }

  function useGPS(){
    if(!navigator.geolocation){
      setStatus('Geolocation not supported by this browser.', true);
      return;
    }
    setStatus('Requesting your location...');
    navigator.geolocation.getCurrentPosition(
      function(pos){
        gpsCoords = [pos.coords.latitude, pos.coords.longitude];
        selectedOrigin = { lat: gpsCoords[0], lon: gpsCoords[1], label: 'Your location' };
        document.getElementById('origin').value = 'My current location';
        setStatus('Location found — ready to route.');
        map.setView(gpsCoords, 13);
      },
      function(err){
        setStatus('Could not get location: ' + err.message, true);
      },
      { enableHighAccuracy:true, timeout:10000 }
    );
  }

  // ---- frequency memory (per-browser, local only) ----
  var FREQ_KEY = 'horizonmaps_freq_v1';
  function loadFreq(){
    try{ return JSON.parse(localStorage.getItem(FREQ_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function bumpFreq(place){
    if(!place || place.label === 'Your location') return;
    try{
      var freq = loadFreq();
      var key = place.lat.toFixed(4) + ',' + place.lon.toFixed(4);
      if(freq[key]){ freq[key].count++; }
      else{ freq[key] = { count:1, label: place.label, lat: place.lat, lon: place.lon }; }
      localStorage.setItem(FREQ_KEY, JSON.stringify(freq));
    }catch(e){}
  }
  function getTopFreq(n){
    var freq = loadFreq();
    return Object.keys(freq).map(function(k){ return freq[k]; })
      .sort(function(a,b){ return b.count - a.count; })
      .slice(0, n);
  }

  function debounce(fn, delay){
    var t;
    return function(){
      var args = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(function(){ fn.apply(ctx, args); }, delay);
    };
  }

  function shortLabel(label){
    return label.split(',').slice(0,3).join(',').trim();
  }

  function biasCenter(){
    if(gpsCoords) return gpsCoords;
    var c = map.getCenter();
    return [c.lat, c.lng];
  }

  // location-biased search: soft bias toward a box around the user's current center
  async function fetchSuggestions(query){
    var center = biasCenter();
    var d = 0.4;
    var viewbox = (center[1]-d) + ',' + (center[0]+d) + ',' + (center[1]+d) + ',' + (center[0]-d);
    var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=5&viewbox=' + viewbox + '&bounded=0&q=' + encodeURIComponent(query);
    var res = await fetch(url);
    var data = await res.json();
    return data.map(function(d){ return { lat: parseFloat(d.lat), lon: parseFloat(d.lon), label: d.display_name }; });
  }

  function renderSuggestions(listEl, items, onPick, freqMode){
    listEl.innerHTML = '';
    if(!items.length){ listEl.classList.remove('show'); return; }
    items.forEach(function(item){
      var row = document.createElement('div');
      row.className = 'suggestion-item';
      row.textContent = shortLabel(item.label);
      if(freqMode){
        var badge = document.createElement('span');
        badge.className = 'freq-badge';
        badge.textContent = '★ frequent';
        row.appendChild(badge);
      }
      row.onclick = function(){ onPick(item); listEl.classList.remove('show'); };
      listEl.appendChild(row);
    });
    listEl.classList.add('show');
  }

  function wireField(inputEl, listEl, onSelect, clearSelection){
    inputEl.addEventListener('focus', function(){
      if(!inputEl.value.trim()){
        renderSuggestions(listEl, getTopFreq(5), function(item){
          inputEl.value = shortLabel(item.label);
          onSelect(item);
        }, true);
      }
    });
    inputEl.addEventListener('input', debounce(async function(){
      clearSelection();
      var val = inputEl.value.trim();
      if(val.length < 3){ listEl.classList.remove('show'); return; }
      try{
        var results = await fetchSuggestions(val);
        renderSuggestions(listEl, results, function(item){
          inputEl.value = shortLabel(item.label);
          onSelect(item);
        });
      }catch(e){ /* silent — user can still hit Route to try a full geocode */ }
    }, 350));
  }

  wireField(
    document.getElementById('origin'),
    document.getElementById('originSuggest'),
    function(item){ selectedOrigin = item; },
    function(){ if(document.getElementById('origin').value !== 'My current location') selectedOrigin = null; }
  );
  wireField(
    document.getElementById('dest'),
    document.getElementById('destSuggest'),
    function(item){ selectedDest = item; },
    function(){ selectedDest = null; }
  );

  document.addEventListener('click', function(e){
    var oWrap = document.getElementById('origin').closest('.field-wrap');
    var dWrap = document.getElementById('dest').closest('.field-wrap');
    if(oWrap && !oWrap.contains(e.target)) document.getElementById('originSuggest').classList.remove('show');
    if(dWrap && !dWrap.contains(e.target)) document.getElementById('destSuggest').classList.remove('show');
  });

  async function geocode(query){
    var res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query));
    var data = await res.json();
    if(!data.length) throw new Error('Could not find "' + query + '"');
    return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), label: data[0].display_name };
  }

  function clearRoute(){
    if(routeLine){ map.removeLayer(routeLine); routeLine = null; }
    if(originMarker){ map.removeLayer(originMarker); originMarker = null; }
    if(destMarker){ map.removeLayer(destMarker); destMarker = null; }
  }

  async function resolveOrigin(){
    var val = document.getElementById('origin').value.trim();
    if(!val) throw new Error('Enter a starting point, or tap 📍');
    if(selectedOrigin) return selectedOrigin;
    if(val === 'My current location'){
      if(!gpsCoords) throw new Error('Tap 📍 to get your current location first');
      return { lat: gpsCoords[0], lon: gpsCoords[1], label: 'Your location' };
    }
    return await geocode(val);
  }

  async function resolveDest(){
    var val = document.getElementById('dest').value.trim();
    if(selectedDest) return selectedDest;
    return await geocode(val);
  }

  async function go(){
    var destVal = document.getElementById('dest').value.trim();
    if(!destVal){ setStatus('Enter a destination.', true); return; }

    var btn = document.getElementById('routeBtn');
    btn.disabled = true;
    clearRoute();

    try{
      setStatus('Locating starting point...');
      var start = await resolveOrigin();

      setStatus('Locating destination...');
      var dest = await resolveDest();

      setStatus('Calculating route...');
      var url = 'https://router.project-osrm.org/route/v1/driving/' +
        start.lon + ',' + start.lat + ';' + dest.lon + ',' + dest.lat +
        '?overview=full&geometries=geojson';
      var res = await fetch(url);
      var data = await res.json();
      if(data.code !== 'Ok' || !data.routes || !data.routes.length){
        throw new Error('No route found between those points');
      }

      var route = data.routes[0];
      var coords = route.geometry.coordinates.map(function(c){ return [c[1], c[0]]; });

      routeLine = L.polyline(coords, { color: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#4285F4', weight: 5, opacity: 0.9 }).addTo(map);

      originMarker = L.marker([start.lat, start.lon]).addTo(map).bindPopup('Start: ' + (start.label || 'Your location'));
      destMarker = L.marker([dest.lat, dest.lon]).addTo(map);

      var miles = (route.distance / 1609.34).toFixed(1);
      var totalMin = Math.round(route.duration / 60);
      var h = Math.floor(totalMin / 60), m = totalMin % 60;
      var timeStr = h > 0 ? (h + ' hr ' + m + ' min') : (m + ' min');

      var popupHtml =
        '<div class="route-summary">' +
          '<div class="big">' + timeStr + '</div>' +
          '<div class="sub">' + miles + ' mi &middot; fastest route</div>' +
        '</div>';

      destMarker.bindPopup(popupHtml).openPopup();
      map.fitBounds(coords, { padding: [40, 40] });

      setStatus(timeStr + ' · ' + miles + ' mi');
      bumpFreq(start);
      bumpFreq(dest);
      document.getElementById('originSuggest').classList.remove('show');
      document.getElementById('destSuggest').classList.remove('show');
    }catch(e){
      setStatus(e.message, true);
    }finally{
      btn.disabled = false;
    }
  }

  document.getElementById('dest').addEventListener('keydown', function(e){
    if(e.key === 'Enter') go();
  });
  document.getElementById('origin').addEventListener('keydown', function(e){
    if(e.key === 'Enter') go();
  });
</script>
</body>
</html>
